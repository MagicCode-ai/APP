# macOS Docker Desktop 无法使用 Linux 的 network_mode: host。
# 本机无 Docker 时请用 scripts/dev.sh 跑编译好的 livekit-server。
services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7881:7881/udp"
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
